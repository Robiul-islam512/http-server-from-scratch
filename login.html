<!-- vibe coded -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Tick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9E6DC;
    --paper-raised:#F1EEE3;
    --ink:#24261F;
    --ink-soft:#5B5B4E;
    --rule:#C9C2AC;
    --check:#3F6B4F;
    --brick:#B54834;
  }

  *{box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}

  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    line-height:1.6;
  }

  a{color:inherit;}

  .sheet{
    max-width:920px;
    margin:0 auto;
    padding:0 32px 0 72px;
    position:relative;
    min-height:100vh;
  }
  .sheet::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:40px;
    width:1px;
    background:var(--rule);
  }
  .sheet::after{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:36px;
    width:1px;
    background:var(--brick);
    opacity:0.55;
  }

  header{
    padding:36px 0 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:24px;
  }
  .wordmark{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:1.15rem;
    letter-spacing:0.02em;
    text-decoration:none;
  }
  .wordmark span{color:var(--check);}

  nav{
    font-family:'JetBrains Mono', monospace;
    font-size:0.9rem;
  }
  nav a{
    text-decoration:none;
    color:var(--ink-soft);
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  nav a:hover, nav a:focus-visible{
    color:var(--ink);
    border-bottom-color:var(--ink);
  }

  /* ---------- Form area ---------- */
  .wrap{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:44px 0 64px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:3px;
    padding:36px 34px 32px;
  }

  .card h1{
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size:1.5rem;
    margin:0 0 8px;
  }
  .card > p{
    margin:0 0 28px;
    color:var(--ink-soft);
    font-size:0.98rem;
  }

  .field{
    margin-bottom:20px;
  }
  .field-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:7px;
  }
  .field label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:0.82rem;
    color:var(--ink-soft);
  }
  .field-row a{
    font-family:'JetBrains Mono', monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .field-row a:hover, .field-row a:focus-visible{
    color:var(--ink);
    border-bottom-color:var(--ink);
  }
  .field input{
    width:100%;
    font-family:'Source Serif 4', Georgia, serif;
    font-size:1rem;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:11px 13px;
  }
  .field input:focus-visible{
    outline:2px solid var(--check);
    outline-offset:1px;
    border-color:var(--check);
  }
  .field input::placeholder{
    color:#9A9484;
  }

  .submit{
    width:100%;
    font-family:'JetBrains Mono', monospace;
    font-size:0.95rem;
    color:var(--paper-raised);
    background:var(--check);
    border:none;
    border-radius:2px;
    padding:13px 20px;
    cursor:pointer;
    margin-top:6px;
    transition:background 0.15s ease;
  }
  .submit:hover, .submit:focus-visible{
    background:#345c42;
  }

  .divider{
    margin:26px 0 20px;
    border-top:1px solid var(--rule);
  }

  .switch{
    text-align:center;
    font-size:0.95rem;
    color:var(--ink-soft);
  }
  .switch a{
    color:var(--check);
    text-decoration:none;
    font-weight:600;
    border-bottom:1px solid transparent;
  }
  .switch a:hover, .switch a:focus-visible{
    border-bottom-color:var(--check);
  }

  @media (max-width: 640px){
    .sheet{padding:0 20px 0 44px;}
    .sheet::before{left:24px;}
    .sheet::after{left:20px;}
    .card{padding:28px 22px 26px;}
  }

  :focus-visible{
    outline:2px solid var(--check);
    outline-offset:2px;
  }
</style>
</head>
<body>

<div class="sheet">

  <header>
    <a href="index.html" class="wordmark">tick<span>.</span></a>
    <nav>
      <a href="register.html">Don't have an account? Register</a>
    </nav>
  </header>

  <div class="wrap">
    <form class="card" novalidate method="POST" action="/login">
      <h1>Welcome back</h1>
      <p>Log in to pick up where your list left off.</p>

      <div class="field">
        <label for="name_or_email">Name or email</label>
        <input type="text" id="name_or_email" name="name_or_email" placeholder="Jordan Rivers or you@example.com" autocomplete="username" required>
      </div>

      <div class="field">
        <div class="field-row">
          <label for="password">Password</label>
          <a href="#">Forgot it?</a>
        </div>
        <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="submit">Log in</button>

      <div class="divider"></div>
      <p class="switch">Don't have an account? <a href="register.html">Register</a></p>
    </form>
  </div>

</div>

</body>
</html>
